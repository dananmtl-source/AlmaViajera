<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cuenta.css">
  <link rel="icon" type="image/x-icon" href="../assets/img/AlmaViajeraLogo.png">
  <title>Mi cuenta | AlmaViajera</title>
  <script src="../../utils/auth.js"></script>
</head>

<body class="gridBase">



  <header class="cabecera">
    <a href="inicio.html" class="identidad">
      <img src="../../assets/images/AlmaViajeraLogo.png" alt="Logo de AlmaViajera">
      <span class="logo">AlmaViajera</span>
    </a>
   <nav class="menu" aria-label="Navegación principal">
      <a href="inicio.html">Inicio</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="cuenta.html" aria-current="page">Mi cuenta</a>
    </nav>

   
    <a href="../../../index.html" id="logout" class="boton-viaje">
      Cerrar sesión
    </a>
  </header>

  <!-- Contenido -->
  <main class="cuenta">
    <h1>Mi cuenta</h1>

    <!-- Perfil -->
    <section class="perfil" aria-labelledby="titulo-perfil">
      <h2 id="titulo-perfil">Perfil</h2>
      <img id="avatar" class="avatar" src="../assets/img/avatar-default.png" alt="Foto de perfil">
      <div>
        <p id="nombre-usuario" class="perfil-nombre"></p>
        <p id="email-usuario" class="perfil-email"></p>
        <label for="foto" class="boton-secundario">Cambiar foto</label>
        <input type="file" id="foto" name="foto" accept="image/*" hidden>
      </div>
    </section>

    <!-- Estadísticas -->
    <section class="estadisticas" aria-labelledby="titulo-estadisticas">
      <h2 id="titulo-estadisticas">Mi actividad</h2>
      <ul class="estadisticas-lista">
        <li><strong id="total-favoritos">0</strong> <span>Favoritos</span></li>
        <li><strong id="total-paises">0</strong> <span>Países visitados</span></li>
        <li><strong id="total-ciudades">0</strong> <span>Ciudades</span></li>
      </ul>
    </section>

    <!-- Datos personales -->
    <section aria-labelledby="titulo-datos">
      <h2 id="titulo-datos">Datos personales</h2>
      <form id="form-datos" class="formulario">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos">

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>

        <label for="pais">País de residencia</label>
        <select id="pais" name="pais">
          <option value="">Selecciona un país</option>
        </select>

        <label for="bio">Sobre mí</label>
        <textarea id="bio" name="bio" rows="3" maxlength="200"></textarea>

        <button type="submit" class="boton-viaje">Guardar cambios</button>
      </form>
    </section>

    <!-- Preferencias -->
    <section aria-labelledby="titulo-preferencias">
      <h2 id="titulo-preferencias">Preferencias</h2>
      <form id="form-preferencias" class="formulario">
        <label for="idioma">Idioma</label>
        <select id="idioma" name="idioma">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>

        <label for="moneda">Moneda</label>
        <select id="moneda" name="moneda">
          <option value="EUR">Euro (€)</option>
          <option value="USD">Dólar (US$)</option>
          <option value="ARS">Peso argentino ($)</option>
        </select>

        <label for="tema">Tema</label>
        <select id="tema" name="tema">
          <option value="claro">Claro</option>
          <option value="oscuro">Oscuro</option>
        </select>

        <fieldset>
          <legend>Notificaciones</legend>
          <label><input type="checkbox" name="notif-email" checked> Novedades por correo</label>
          <label><input type="checkbox" name="notif-ofertas"> Ofertas de viaje</label>
        </fieldset>

        <button type="submit" class="boton-viaje">Guardar preferencias</button>
      </form>
    </section>

    <!-- Seguridad -->
    <section aria-labelledby="titulo-seguridad">
      <h2 id="titulo-seguridad">Seguridad</h2>
      <form id="form-password" class="formulario">
        <label for="password-actual">Contraseña actual</label>
        <input type="password" id="password-actual" name="password-actual"
               autocomplete="current-password" required>

        <label for="password-nueva">Nueva contraseña</label>
        <input type="password" id="password-nueva" name="password-nueva"
               autocomplete="new-password" minlength="8" required>

        <label for="password-repetir">Repetir nueva contraseña</label>
        <input type="password" id="password-repetir" name="password-repetir"
               autocomplete="new-password" minlength="8" required>

        <p id="mensaje-password" role="alert"></p>
        <button type="submit" class="boton-viaje">Cambiar contraseña</button>
      </form>
    </section>

    <!-- Pie de página -->
    <footer class="footer">

        <nav aria-label="Enlaces del pie de página">
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="#">Política de privacidad</a>
            <a href="#">Descubre</a>
            <a href="#">Ayuda</a>
        </nav>

        <p>© 2026 AlmaViajera.</p>
        <p>Hecho en Bilbao.</p>

    </footer>

</body>
</html>
