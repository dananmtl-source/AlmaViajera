<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/inicio.css">
    <link rel="icon" type="image/x-icon" href="../assets/img/AlmaViajeraLogo.png">
    <script src="../../ui/paginator.js" defer></script>
    <script src="../../index.js" defer></script>
    <script src="../../utils/auth.js"></script>
    <title>AlmaViajera</title>
</head>

<body class="gridBase">

    <!-- Cabecera -->
    <header class="cabecera">
        <!-- Logo de la web -->
        <a href="inicio.html" class="identidad">
            <img src="../../assets/images/AlmaViajeraLogo.png" alt="Logo de AlmaViajera">
            <span class="logo">AlmaViajera</span>
        </a>

        <!-- Menú de navegación -->
        <nav class="menu" aria-label="Navegación principal">
            <a href="inicio.html">Inicio</a>
            <a href="viajes.html">Viajes</a>
            <a href="favoritos.html">Favoritos</a>
            <a href="cuenta.html">Mi cuenta</a>
        </nav>
           <!-- Cerrar sesión -->
        <a href="../../../index.html" id="logout" class="boton-viaje">
            Cerrar sesión
        </a>
    </header>


    <!-- Contenido -->
    <main>
        <!-- Idioma -->
        <select id="language-switcher" aria-label="Selección de idioma">
            <details class="language-selector">
                <summary class="menu-toggle">Elegir idioma</summary>
                <option value="es">ES</option>
                <option value="en">EN</option>
            </details>
        </select>

        <!-- Buscador -->
        <section>
            <article class="buscador">
                <select id="destino">
                    <option value="">Selecciona un país</option>
                </select>
            </article>
            <button id="buscarPais">Buscar</button>
        </section>

        <!-- Favoritos -->
        <section id="resultadosDestinos" aria-live="polite" aria-label="Resultados de búsqueda">
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">

        <nav>
            <a href="https://instagram.com" target="_blank">Instagram</a>
            <a href="#">Política de privacidad</a>
            <a href="#">Descubre</a>
            <a href="#">Ayuda</a>

        </nav>
        <p>© 2026 AlmaViajera.</p>
        <p>Hecho en Bilbao.</p>
    </footer>
</body>
<script type="module" src="/src/index.js" defer></script>
<script type="module" src="/src/localStorage.js" defer></script>

</html>
