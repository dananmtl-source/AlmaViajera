<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Hojas de estilos -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/favoritos.css">
    <link rel="icon" type="image/x-icon" href="../assets/img/AlmaViajeraLogo.png">
    <script type="module" src="../../ui/favoritos.js"></script>
    <script src="../../utils/auth.js"></script>


    <!-- Icono de la web -->
    <link rel="icon" type="image/x-icon" href="../../assets/images/AlmaViajeraLogo.png">

    <!-- JavaScript para mostrar los países favoritos -->
    <script src="../../utils/auth.js"></script>


    <title>AlmaViajera | Mis favoritos</title>
</head>

<body class="gridBase">

    <!-- Cabecera -->
    <header class="cabecera">

        <!-- Logo y nombre de la web -->
        <a href="inicio.html" class="identidad">
            <img src="../../assets/images/AlmaViajeraLogo.png" alt="Logo de AlmaViajera">
            <span class="logo">AlmaViajera</span>
        </a>

        <!-- Menú de navegación -->
        <nav class="menu" aria-label="Navegación principal">
            <a href="inicio.html">Inicio</a>
            <a href="favoritos.html">Favoritos</a>
            <a href="cuenta.html">Mi cuenta</a>
        </nav>

        <!-- Cerrar sesión -->
        <a href="../../../index.html" id="logout" class="boton-viaje">
            Cerrar sesión
        </a>
    </header>

    </header>

    <!-- Contenido principal -->
    <main>

        <!-- Selector de idioma -->
        <select id="language-switcher" aria-label="Selección de idioma">
            <option value="es" selected>ES</option>
            <option value="en">EN</option>
        </select>

        <!-- Sección de países favoritos -->
        <section id="paises-destacados">

            <h2>Mis destinos favoritos</h2>

            <!-- JavaScript creará aquí una tarjeta por cada país favorito -->
            <div id="lista-favoritos"></div>

            <!-- Mensaje que aparece cuando no hay favoritos -->
            <p id="mensaje-vacio">
                Todavía no tienes países favoritos.
            </p>

        </section>

    </main>

    <!-- Pie de página -->
    <footer class="footer">

        <nav aria-label="Enlaces del pie de página">
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="#">Política de privacidad</a>
            <a href="#">Descubre</a>
            <a href="#">Ayuda</a>
        </nav>

        <p>© 2026 AlmaViajera.</p>
        <p>Hecho en Bilbao.</p>

    </footer>

</body>
<script type="module" src="/src/ui/favoritos.js" defer></script>
<script type="module" src="/src/localStorage.js" defer></script>

</html>
