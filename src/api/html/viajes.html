<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="/assets/img/AlmaViajeraLogo.png">
    <script src="utils.js"></script>
    <script src="index.js"></script>
    <title>AlmaViajera</title>
</head>

<body class="gridBase">

    <!-- Cabecera -->
    <header class="cabecera">
        <img src="assets/img/AlmaViajeraLogo.png" alt="logo">
        <a href="index.html" class="logo">
            AlmaViajera
        </a>

        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="destinos.html">Destinos</a>
            <a href="explorar.html">Explorar</a>
            <a href="favoritos.html">Favoritos</a>
        </nav>

        <a href="mi-viaje.html" class="botonViaje">
            Mi viaje
        </a>
    </header>

    <!-- Contenido -->
    <main>
        <!-- Idioma -->
        <select id="language-switcher" aria-label="Selección de idioma">
            <details class="language-selector">
                <summary class="menu-toggle">Elegir idioma</summary>
                <option value="es">ES</option>
                <option value="en">EN</option>
            </details>
        </select>

        <!-- Favoritos (se podrían agrupar por ciudades o países)-->
        <section>
            <article class="favoritos">
                <label for="destino"> Destino: </label>
                <input type="text" id="destino" class="destino" placeholder="Barcelona" />
                <button class="" filter></button>
            </article>
        </section>

        <!-- Visitados -->
        <section class="visitados">
            <h2>Favoritos</h2>
            <article class="card">
                <h3 class="nombreLugar"></h3>
                <p class="textoTarjeta"></p>
                <input type="button" class="verMas" value="Ver más" />
            </article>
        </section>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <section class="foot-section">
            <div class="foot-div">
                <a href="tel:+34944762894"><img src=""></a>
                <a href="tel:+34944762894"><img src=""></a>
                <a href="tel:+34944762894"><img src=""></a>
            </div>
        </section>
        <section class="foot-section sectionA terminos-politica">
            <p>Política de cookies</p>
            <p>Aviso legal</p>
            <p>Política de privacidad</p>
        </section>
    </footer>
</body>

</html>
