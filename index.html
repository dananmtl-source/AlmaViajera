<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/api/css/style.css">
    <link rel="stylesheet" href="src/api/css/login.css">
    <link rel="icon" type="image/x-icon" href="/assets/img/AlmaViajeraLogo.png">
    <script src="src/index.js" defer></script>
    <script src="src/ui/login.js" defer></script>
    <script src="../../utils/auth.js"></script>
   
    <title>AlmaViajera</title>
</head>

<body class="gridBase">

    <!-- Cabecera -->
    <header class="cabecera">
        <!-- Logo de la web -->
        <a href="index.html" class="identidad">
            <img src="src/assets/images/AlmaViajeraLogo.png" alt="Logo de AlmaViajera">
            <span class="logo">AlmaViajera</span>
        </a>

        <!-- Menú de navegación -->
        <nav class="menu" aria-label="Navegación principal">
            <a href="src/api/html/inicio.html">Inicio</a>
            <a href="src/api/html/favoritos.html">Favoritos</a>
            <a href="src/api/html/cuenta.html">Mi cuenta</a>
        </nav>

        <!-- Acceso a la lista personal de viajes -->
        <a href="mi-viaje.html" class="boton-viaje">
            Mi viaje
        </a>
    </header>

    <!-- Login -->
    <main>
        <!-- Idioma -->
        <select id="language-switcher" aria-label="Selección de idioma">
            <details class="language-selector">
                <summary class="menu-toggle">Elegir idioma</summary>
                <option value="es">ES</option>
                <option value="en">EN</option>
            </details>
        </select>
        <!-- Login -->
        <section class="loginSection">
            <form id="login">
                <label for="usuario" class="loginUsuario"> Usuario: </label>
                <input type="text" id="usuario" class="usuario" placeholder=" Indica tu usuario" />

                <label for="contraseña" class="loginContraseña">Contraseña:</label>
                <input type="password" id="contrasena" class="contraseña" placeholder="*****" />
                <p id="loginError" class="loginError" role="alert"></p>
                <button class="loginbtn" type="submit">Iniciar sesión</button>

                <div class="options-row">
                    <div class="form-check d-flex align-items-center gap-2">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
            </form>

        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">

        <nav>
            <a href="https://instagram.com" target="_blank">Instagram</a>
            <a href="#">Política de privacidad</a>
            <a href="#">Descubre</a>
            <a href="#">Ayuda</a>

        </nav>
        <p>© 2026 AlmaViajera.</p>
        <p>Hecho en Bilbao.</p>
    </footer>
</body>

</html>
